name: Publish container image

# Builds the self-hosting Dockerfile and publishes it for this fork.
# The upstream docker-image workflow only runs in hieunc229/mailflare.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'TheMich157/mailflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/themich157/mailflare:latest
            ghcr.io/themich157/mailflare:sha-${{ github.sha }}
